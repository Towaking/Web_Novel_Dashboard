# Tema aplikasi, sesuai DESIGN.md. Streamlit memakai satu tema terang; mode gelap dipasang oleh
# app/streamlit_app.py (tombol "Dark mode" di sidebar), jadi aplikasi selalu dibuka dalam mode terang
# dan tidak mengikuti pengaturan sistem pengunjung.

[theme]
base = "light"
primaryColor = "#1F5E52"
backgroundColor = "#FBF8F3"
secondaryBackgroundColor = "#F2EDE4"
textColor = "#1E2433"
borderColor = "#E4DED3"

[server]
headless = true
fileWatcherType = "poll"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false
